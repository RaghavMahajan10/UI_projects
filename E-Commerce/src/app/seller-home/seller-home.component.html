<div><h1 #deferLoad>Products</h1></div>
<div class="product-list">
    @for(product of pageslice(); track product.id) {
        <div class="product-item">
            <div class="image-wrapper">
            <img [src]="product.imageUrl" 
                 [alt]="product.productName"
                 (error)="handleImageError($event)" />
            </div>
            <h2>{{product.productName}}</h2>
            <p>{{product.price | currency:'USD'}}</p>
            <p>{{product.description}}</p>
            <button (click)="viewProduct(product.id)">View</button>
        </div>

    }

</div>
<div class="pagination">
    <button (click)="previousPage()" [disabled]="currentPage === 1">Previous</button>
    <button (click)="nextPage()" [disabled]="(currentPage * pageSize) >= products.length">Next</button>
</div>
