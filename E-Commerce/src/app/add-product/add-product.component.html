<div><h1>Add Product </h1></div>
<div>
    <form [formGroup]="addProductForm" (ngSubmit)="addproduct(addProductForm.value)">

     <input type="text" formControlName="productName" placeholder="Product Name" />
     <select formControlName="category" id="category">
        <option value="" disabled selected>Select Category</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
     </select>
     <input type="text" formControlName="price" placeholder="Price" />
     <textarea formControlName="description" placeholder="Description"></textarea>
     <input type="file" formControlName="imageUrl" (change)="onFileSelected($event)" accept="image/*">
     <button type="submit">Add Product</button>

    </form>

</div>
