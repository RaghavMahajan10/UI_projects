<div><h1>Edit Product </h1></div>
<div>
    <form [formGroup]="addProductForm" (ngSubmit)="editProduct(addProductForm.value)">

     <input type="text" formControlName="productName" placeholder="Product Name" />
     <select formControlName="category" id="category">
        <option value="" disabled selected>Select Category</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
     </select>
     <input type="text" formControlName="price" placeholder="Price" />
     <textarea formControlName="description" placeholder="Description"></textarea>
     <input type="text" formControlName="imageUrl" placeholder="Image URL" />
     <button type="submit">Edit Product</button>

    </form>

</div>
